name: Build and Deploy to RENDER

on:
  push:
    branches:
      - main
      - staging
      - dev
  
  workflow_dispatch:  # Allow manual trigger

jobs:
  typecheck:
    name: Type Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint -- --max-warnings=9999

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: typecheck
    outputs:
      image_full: ${{ steps.set-tag.outputs.full }}
      image_tag: ${{ steps.set-tag.outputs.tag }}
      environment: ${{ steps.set-tag.outputs.env }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Determine Image Metadata
        id: set-tag
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "repo=${{ secrets.DOCKER_USERNAME }}/jovo_fe" >> $GITHUB_OUTPUT
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "full=${{ secrets.DOCKER_USERNAME }}/jovo_fe:latest" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "repo=${{ secrets.DOCKER_USERNAME }}/jovo_fe_staging" >> $GITHUB_OUTPUT
            echo "tag=latest-staging" >> $GITHUB_OUTPUT
            echo "full=${{ secrets.DOCKER_USERNAME }}/jovo_fe_staging:latest-staging" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "repo=${{ secrets.DOCKER_USERNAME }}/jovo_fe_dev" >> $GITHUB_OUTPUT
            echo "tag=latest-dev" >> $GITHUB_OUTPUT
            echo "full=${{ secrets.DOCKER_USERNAME }}/jovo_fe_dev:latest-dev" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.set-tag.outputs.full }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repository }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cleanup Old Docker Images (Production Only)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "🧹 Cleaning up old Docker images on Docker Hub..."
          
          # Get all tags for the repository
          REPO_NAME="${{ secrets.DOCKER_USERNAME }}/jovo_fe"
          
          # Fetch all tags and sort by creation date, keep only latest 5
          curl -s -X GET \
            -H "Authorization: Bearer ${{ secrets.DOCKER_PASSWORD }}" \
            "https://hub.docker.com/v2/repositories/${REPO_NAME}/tags/?page_size=100" | \
            jq -r '.results | sort_by(.last_updated) | reverse | .[5:][] | .name' | \
            while read tag; do
              if [[ "$tag" != "latest" ]]; then
                echo "Deleting tag: $tag"
                curl -X DELETE \
                  -H "Authorization: Bearer ${{ secrets.DOCKER_PASSWORD }}" \
                  "https://hub.docker.com/v2/repositories/${REPO_NAME}/tags/${tag}/"
              fi
            done
          
          echo "✅ Cleanup complete - kept latest 5 images"


      - name: Image build summary
        run: |
          echo "### 🐳 Docker Image Built Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ steps.set-tag.outputs.full }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ steps.set-tag.outputs.env }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          
  deploy:
    name: Deploy to RENDER
    runs-on: ubuntu-latest
    needs: build
    if: success()

    steps:
      - name: Trigger RENDER Deployment
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            HOOK="${{ secrets.RENDER_DEPLOY_HOOK_PROD }}"
            ENV="Production"
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            HOOK="${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}"
            ENV="Staging"
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            HOOK="${{ secrets.RENDER_DEPLOY_HOOK_DEV }}"
            ENV="Development"
          fi
          
          echo "🚀 Triggering $ENV Deployment..."
          echo "Hook: ${HOOK:0:20}... (redacted)"
          
          response=$(curl -s -w "\n%{http_code}" -X POST "$HOOK")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          if [[ "$http_code" =~ ^2 ]]; then
            echo "✅ Deployment triggered successfully (HTTP $http_code)"
            echo "### 🚀 $ENV Deployment" >> $GITHUB_STEP_SUMMARY
            echo "Status: **Triggered Successfully**" >> $GITHUB_STEP_SUMMARY
            echo "Response: \`$body\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Deployment failed with status code: $http_code"
            echo "Response: $body"
            exit 1
          fi